# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-2.5-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 256
  quantization: "4bit"
  prompt: >
    Extract all numerical values and categories from this chart into a clean
    GitHub-Flavored Markdown table.
    Output only the markdown table without conversational explanation.
    When converting a chart into a table:

    1. Identify the chart type and its data organization
      before constructing the table.

    2. For multi-series charts:
      - Use one row for each data series.
      - Use the series name as the first-column label.
      - Use the category or time points as column headers.

    3. For single-series charts:
      - Use one row for each category.
      - Use the category labels as the first column.

    4. Preserve the original meaning of all headers.
      Do not invent or replace column names with unrelated
      generic labels.

    5. Preserve units and labels when they are explicitly
      provided in the chart.

    6. Do not add explanations or descriptions.
      Output only the extracted table in Markdown format.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
