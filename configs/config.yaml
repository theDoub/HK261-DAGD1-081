# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-2.5-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 256
  quantization: "4bit"
  prompt: |
    Extract the chart into one complete GitHub-Flavored Markdown table. Output only the table.

    Preserve labels exactly as shown in the chart, including capitalization, spelling, units, and symbols that are part of an axis, legend, or series label. Do not replace a visible label with a generic or inferred name such as "entity", "category", or "value". Do not add chart titles, subtitles, or source text to headers unless they are themselves data labels.

    Choose the table orientation from the chart's data dimensions:
    - For a single series, use one row per x-axis category or time point and a value column.
    - For multiple named series over ordered x-axis categories (for example, countries across years in a line chart), use one row per series and one column per x-axis category.
    - For grouped or stacked bars, use one row per x-axis category and one value column per legend series.
    Use the chart's visible category, series, and axis labels as the corresponding headers and row labels. Do not transpose unless the chart structure supports that orientation.

    Extract every visible value in its original order and preserve numerical precision. Do not omit data or invent unsupported values. Ensure every row has the same number of columns.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
