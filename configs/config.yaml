# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-3.8-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 512
  quantization: "4bit"
  prompt_markdown: |
    Convert the chart into one complete GitHub-Flavored Markdown table. Output only the table.

    Identify the chart from its visual marks before choosing the table layout: connected points/curves are a line chart; rectangular marks are bars, whether horizontal or vertical. Then identify the category/time axis and legend series. Do not infer chart type from labels or from the fact that the axis shows years.

    - LINE CHART: Always use one row per plotted line/series, even when there is only one line. The first column is "Entity" and contains the exact line label; each x-axis tick is a separate remaining column. Never put years in data rows for a line chart.
      | Entity | 2005 | 2006 |
      |---|---:|---:|
      | <line label> | <value> | <value> |
    - GROUPED OR STACKED BAR CHART: One row per category on the bar/category axis; one value column per exact legend series/segment. For bars whose categories are years, use one row per year and one column per series.
      | Entity | Disapprove | Approve |
      |---|---:|---:|
      | <category> | <value> | <value> |
    - SINGLE-SERIES BAR CHART: One row per bar/category and two columns. Never put all categories in the header.
      | Country | <full measure name> |
      |---|---:|
      | <country> | <value> |
    - PIE CHART: One row per slice and two columns: category and value. Never put all slice labels across the header.
      | Entity | Value |
      |---|---:|
      | <slice> | <value> |

    Headers and values:
    - Copy category, time, and legend labels as displayed; do not paraphrase, abbreviate, or substitute a guessed label. In particular, do not replace a visible measure with "GPI", "Value", "Category", "Show", or "Activity".
    - Use "Country" when each row is a country category (for example, one bar/value per country), regardless of whether the chart is horizontal or vertical. Use "Entity" when each row is a plotted line/series or a non-country category without a more specific visible axis label. For time-category bars, use "Year".
    - For a single-measure chart, use its full displayed measurement/axis label as the value header. If absent, use the title/subtitle phrase that names the quantity, including a year when shown. Keep units in this header when displayed.
    - Use exact legend labels for multi-series headers/rows. Country names used as line-series labels belong under "Entity"; country names used as individual categories belong under "Country".
    - Keep values numeric; do not repeat units or percent signs in cells. Read printed data labels when present. For an unlabeled plotted point or bar, estimate its value from the axis ticks instead of leaving its cell blank. Do not invent values for categories or points that are not plotted.
    - Extract each plotted category and value once, in chart order, and keep every row the same length. Before answering, verify that line charts have series as rows, while time-category bar charts have years as rows.
  prompt_linearized: |
    Convert the chart into one complete DePlot-style linearized table. Output only the linearized table.

    Use exactly this token and row contract:
    - Start with TITLE | <exact chart title>, or omit the title line if no title is visible.
    - Put the header row first as a pipe-separated line beginning with <START>, for example: <START> Entity | 2005 | 2006
    - Put one pipe-separated data row after every <NEW_ROW> token, for example: <NEW_ROW> <line label> | 12 | 15
    - Finish with exactly <END>.
    - Keep every row the same number of columns as the header.
    - Copy exact category, time, legend, and measurement labels; keep numeric values only (no units or percent signs).
    - Use line-series rows and time-axis columns for line charts. Use category rows and legend/segment columns for grouped or stacked bars. Use one category and one full-measurement value column for single-series bars and pie charts.
    - Do not add Markdown separators, prose, code fences, or any text outside the linearized representation.
  prompt: |
    Convert the chart into one complete GitHub-Flavored Markdown table. Output only the table.

    Identify the chart from its visual marks before choosing the table layout: connected points/curves are a line chart; rectangular marks are bars, whether horizontal or vertical. Then identify the category/time axis and legend series. Do not infer chart type from labels or from the fact that the axis shows years.

    - LINE CHART: Always use one row per plotted line/series, even when there is only one line. The first column is "Entity" and contains the exact line label; each x-axis tick is a separate remaining column. Never put years in data rows for a line chart.
      | Entity | 2005 | 2006 |
      |---|---:|---:|
      | <line label> | <value> | <value> |
    - GROUPED OR STACKED BAR CHART: One row per category on the bar/category axis; one value column per exact legend series/segment. For bars whose categories are years, use one row per year and one column per series.
      | Entity | Disapprove | Approve |
      |---|---:|---:|
      | <category> | <value> | <value> |
    - SINGLE-SERIES BAR CHART: One row per bar/category and two columns. Never put all categories in the header.
      | Country | <full measure name> |
      |---|---:|
      | <country> | <value> |
    - PIE CHART: One row per slice and two columns: category and value. Never put all slice labels across the header.
      | Entity | Value |
      |---|---:|
      | <slice> | <value> |

    Headers and values:
    - Copy category, time, and legend labels as displayed; do not paraphrase, abbreviate, or substitute a guessed label. In particular, do not replace a visible measure with "GPI", "Value", "Category", "Show", or "Activity".
    - Use "Country" when each row is a country category (for example, one bar/value per country), regardless of whether the chart is horizontal or vertical. Use "Entity" when each row is a plotted line/series or a non-country category without a more specific visible axis label. For time-category bars, use "Year".
    - For a single-measure chart, use its full displayed measurement/axis label as the value header. If absent, use the title/subtitle phrase that names the quantity, including a year when shown. Keep units in this header when displayed.
    - Use exact legend labels for multi-series headers/rows. Country names used as line-series labels belong under "Entity"; country names used as individual categories belong under "Country".
    - Keep values numeric; do not repeat units or percent signs in cells. Read printed data labels when present. For an unlabeled plotted point or bar, estimate its value from the axis ticks instead of leaving its cell blank. Do not invent values for categories or points that are not plotted.
    - Extract each plotted category and value once, in chart order, and keep every row the same length. Before answering, verify that line charts have series as rows, while time-category bar charts have years as rows.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
