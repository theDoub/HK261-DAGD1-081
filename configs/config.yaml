# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-3.8-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 512
  quantization: "4bit"
  prompt: |
    Convert the chart into one complete GitHub-Flavored Markdown table. Output only the table.

    Choose the table layout by chart type, not by whether bars are drawn horizontally or vertically:

    - LINE CHART: Always use one row per plotted line, including a chart with only one line. Put the line's exact label in the first column and each x-axis tick (such as each year) in a separate column. Never make the x-axis ticks into data rows for a line chart.
      | Entity | 2005 | 2006 |
      |---|---:|---:|
      | <line label> | <value> | <value> |
    - GROUPED OR STACKED BAR CHART: Always use one row per category/bar label and one value column per legend series/segment, for both horizontal and vertical bars. Never make the legend series the rows and all category labels the column headers.
      | Entity | Disapprove | Approve |
      |---|---:|---:|
      | <bar/category label> | <value> | <value> |
    - SINGLE-SERIES BAR CHART: Use one row per category/bar label and two columns: category and measured value. Do not put all categories in the header.
      | Country | <measured quantity> |
      |---|---:|
      | <country> | <value> |
    - PIE CHART: Use one row per slice/category and two columns: category and value. Never put all slice labels across the header.
      | Entity | Value |
      |---|---:|
      | <slice label> | <value> |

    Header rules:
    - For country names used as data rows, name the first column "Country". For other categories or line-series labels, use "Entity". Use "Year" as the first header only when each data row is a year (for example, a bar chart whose categories are years).
    - For a single-measure chart, use the full displayed measure name as the value header. Prefer the chart's exact axis/measure label; if absent, use the title or subtitle phrase that names the quantity, including a displayed year when it distinguishes the measure. Do not shorten it to an acronym or replace it with "Value" when a specific name is visible.
    - For multi-series charts, use the exact legend labels as series headers or row labels. Do not promote the title, a bar category, or an axis tick to a series label.
    - Preserve category, time, and legend labels as shown; do not paraphrase or infer replacements. Keep units in the measure header when shown there, and keep table values numeric without repeating units in cells.

    Extract every plotted category and value exactly once, in chart order. Do not omit, duplicate, combine, or invent values. Ensure every row has the same number of columns.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
