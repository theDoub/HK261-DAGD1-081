# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-3.8-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 256
  quantization: "4bit"
  prompt: |
    Convert the chart to one complete GitHub-Flavored Markdown table. Output only the table.

    First identify the plotted dimensions: category or time labels, each data series, and the measured quantity. Choose the table layout from the chart type and keep every value attached to the correct category and series. Do not transpose the chart's data or turn category labels into headers unless they are separate data series.

    Table layout:
    - For a single-measure bar chart, including a horizontal bar chart, make one row per bar/category. Use two columns: the category label and its value. Use "Country" for country names, otherwise "Entity"; use the chart's explicit category-axis label when there is one. Never put all bar categories across the header row.
    - For grouped or stacked bar charts, make one row per category on the category axis and one value column per legend series. Keep the category labels in the first column.
    - For a line chart with one or more named lines, make one row per line/series and one column per x-axis category or time point. Put the exact line label in the first column and preserve the x-axis labels as the remaining column headers. Do not put years in the first column for this layout.
    - If the chart instead plots time as the categories in a bar/grouped-bar chart, use one row per time point and one value column per legend series.

    Examples of the required layouts (replace every placeholder with chart labels and values):
    Single-measure bar chart:
    | Country | <measure named by the chart> |
    |---|---|
    | <country> | <value> |

    Multi-series line chart:
    | Entity | <time 1> | <time 2> |
    |---|---:|---:|
    | <series 1> | <value> | <value> |
    | <series 2> | <value> | <value> |

    Grouped bar chart:
    | Entity | <series 1> | <series 2> |
    |---|---:|---:|
    | <category 1> | <value> | <value> |
    | <category 2> | <value> | <value> |

    Headers and labels:
    - Copy category, time, and legend labels as shown; do not paraphrase them or replace them with a guessed label.
    - For a single-measure chart, use the explicit measurement/y-axis label as the value-column header. If there is no such label, use the chart title or subtitle phrase that names the measured quantity. Do not use a generic "Value" header when the chart provides a specific measure.
    - For multi-series charts, use the exact legend/series names as headers or row labels. Do not substitute the chart title for a series name.
    - Use "Year" only when each table row represents a year. Use "Entity" only when it is the chart's category label or the table rows represent entities without a more specific visible label.
    - Keep units in the measurement header when they are part of its displayed label; do not append units or percentage signs to unrelated category/series names. Keep values numeric and do not repeat units in each cell.
    - Do not put a title, subtitle, or source in the table unless it supplies the only label for the measured quantity as described above.

    Extract every visible category and value in the original order. Preserve numerical precision, include each value once, and do not estimate or invent missing values. Use a consistent number of columns in every row.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
