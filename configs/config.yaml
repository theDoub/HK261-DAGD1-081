# Configuration for Stage 1 Chart-to-Table Pipeline

project:
  name: "Chart-to-Table"
  experiment_name: "stage1_deplot_baseline"
  seed: 42

data:
  dataset_name: "ChartQA"  # Supported: "ChartQA", "PlotQA", "sanity"
  data_dir: "data"
  raw_dir: "data/raw"
  sanity_dir: "data/sanity"
  split: "test"

# Module B5: DePlot Stage (Chart -> Table)
deplot:
  model_name_or_path: "google/deplot"
  max_new_tokens: 512
  prompt: "Generate underlying data table of the figure below:"

# Module B5: Hosted vision API backends. API keys are read from environment.
api_vlm:
  sample_limit: 10
  cache_enabled: true
  cache_dir: ".cache/chart_to_table/api_responses"
  gemini:
    model_name: "gemini-2.5-flash"
  claude:
    model_name: "claude-sonnet-4-6"

# Local Qwen vision-language extraction backend
qwen:
  model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"  # "auto", "cuda", or "cpu"
  max_new_tokens: 256
  quantization: "4bit"
  prompt: >
    You are an expert chart-to-table extraction model.

    Your task is to accurately extract all data from the given chart and convert it into a structured Markdown table.

    Follow the instructions below carefully.

    ### 1. Understand the Chart Structure

    Before extracting data, identify:

    - Chart type (line chart, bar chart, grouped bar chart, stacked bar chart, etc.).
    - X-axis categories or time points.
    - Y-axis measurement and unit.
    - Data series represented by legends or direct labels.
    - Whether the chart contains a single series or multiple series.

    ### 2. Table Orientation Rules

    Choosing the correct table orientation is critical.

    **A. Multi-series Line Charts**

    For line charts containing multiple data series:

    - Each data series MUST be represented as one row.
    - The first column MUST be named `entity`.
    - Each subsequent column MUST represent one X-axis category or time point.
    - Use the series name as the value in the `entity` column.
    - Do NOT use years or X-axis categories as the first-column values.
    - Do NOT represent each data series as a separate column.

    Example:

    For a chart containing four series (Myanmar, Zambia, New Zealand, and Thailand) across multiple years:

    | entity | 2005 | 2006 | 2007 | 2008 |
    |---|---|---|---|---|
    | Myanmar | 56 | 55 | 54 | 53 |
    | Zambia | 27 | 27 | 26 | 26 |
    | New Zealand | 14 | 13 | 13 | 13 |
    | Thailand | 10 | 11 | 12 | 13 |

    **B. Single-series Charts**

    For charts containing only one data series:

    - Represent each X-axis category as one row.
    - Use the category or time point as the first-column value.
    - Use an appropriate measurement header for the second column.

    Example:

    | year | value |
    |---|---:|
    | 2005 | 56 |
    | 2006 | 55 |
    | 2007 | 54 |

    **C. Grouped and Stacked Bar Charts**

    For grouped or stacked bar charts:

    - Identify the primary categories on the X-axis.
    - Identify individual series from the legend.
    - Represent each primary category as one row.
    - Represent each data series as a separate column.
    - Preserve the relationship between categories and series.

    Do not confuse the chart's visual arrangement with its logical data structure.

    ### 3. Header Naming Rules

    - Use `entity` as the first-column header when representing multiple data series as rows.
    - Preserve the original category labels and time points.
    - Use meaningful measurement headers when appropriate.
    - Do not replace specific labels with unrelated generic terms.
    - Do not invent headers that are unsupported by the chart.
    - Preserve the original spelling and meaning of entity names.

    ### 4. Units and Titles

    - Extract units when they are explicitly provided.
    - Do not append chart titles or descriptive sentences to column headers.
    - Do not unnecessarily combine measurement units with header names.
    - Keep chart titles, subtitles, and source information separate from the extracted data table.

    ### 5. Numerical Data Extraction

    - Extract all visible data points.
    - Preserve the original chronological or categorical order.
    - Do not omit rows, columns, or data series.
    - Do not estimate values beyond what the chart supports.
    - Preserve numerical precision as accurately as possible.
    - Do not invent missing values.

    ### 6. Final Output Requirements

    - Output ONLY the extracted Markdown table.
    - Do not include explanations, descriptions, or reasoning.
    - Do not include the chart title or source information.
    - Ensure the table has a consistent number of columns.
    - Verify that the table orientation is consistent with the chart structure before producing the final output.

# Module B2 & B6: Metrics & Evaluation
evaluation:
  metrics:
    - "rms_f1"
    - "rnss"
  save_predictions: true
  output_dir: "outputs/predictions"
